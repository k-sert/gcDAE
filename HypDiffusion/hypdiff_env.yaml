  - pip=23.3
  - numpy=1.24.4
  - scipy=1.10.1
  - matplotlib=3.7.3
  - pillow=10.4.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - albumentations==1.3.0
      - diffusers==0.12.1
      - einops==0.3.0
      - geoopt==0.5.0
      - imageio==2.9.0
      - imageio-ffmpeg==0.4.2
      - invisible-watermark==0.2.0
      - kornia==0.6.0
      - omegaconf==2.1.1
      - open-clip-torch==2.32.0
      - opencv-python-headless==4.10.0.84
      - pytorch-lightning==1.8.5.post0
      - scikit-learn==1.3.2
      - test-tube==0.7.5
      - timm==1.0.27
      - torchmetrics==0.11.0
      - tqdm==4.67.1
      - transformers==4.30.0
      - xformers==0.0.20
      - gradio==3.44.1
      - huggingface-hub==0.16.4
      - ipykernel==6.29.5
      - ipython==8.12.3
      - protobuf==3.20.3
      - safetensors==0.4.5
      - streamlit==1.40.1
      - streamlit-drawable-canvas==0.9.3
      - git+https://github.com/openai/CLIP.git

