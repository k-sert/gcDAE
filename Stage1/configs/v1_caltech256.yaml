model:
  base_learning_rate: 1.0e-05
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    parameterization: "eps"
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "jpg"
    cond_stage_key: "ref"
    image_size: 64
    channels: 4
    cond_stage_trainable: true
    conditioning_key: crossattn
    monitor: val/loss_simple
    scale_factor: 0.18215
    use_ema: False

    scheduler_config: # 10000 warmup steps
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [ 10000 ]
        cycle_lengths: [ 10000000000000 ]
        f_start: [ 1.e-6 ]
        f_max: [ 1. ]
        f_min: [ 1. ]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        use_checkpoint: True
        use_fp16: False
        image_size: 32 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPImageEmbedder
      params:
        version: ${oc.env:CKPT_ROOT}/clip-vit-large-patch14

data:
  target: main.DataModuleFromConfig
  params:
      batch_size: 24
      num_workers: 8
      wrap: False
      train:
          target: ldm.data.reconstruction.ImagesDataset
          params:
              dataset_type: caltech256_encode
              split: train
      validation:
          target: ldm.data.reconstruction.ImagesDataset
          params:
              dataset_type: caltech256_encode
              split: val
      test:
          target: ldm.data.reconstruction.ImagesDataset
          params:
              dataset_type: caltech256_encode
              split: test

lightning:
  callbacks:
    early_stopping:
      target: pytorch_lightning.callbacks.EarlyStopping
      params:
        monitor: val/loss_simple
        patience: 30
        min_delta: 0.0001
        mode: min
        verbose: True
    codecarbon:
      target: main.CodeCarbonCallback
      params:
        project_name: stage1_caltech256
        measure_power_secs: 30
        log_every_n_secs: 300
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 2500
  trainer:
    max_epochs: 100
    num_nodes: 1
    gpus: "0,1"
